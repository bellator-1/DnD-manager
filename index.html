<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11151a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>D&amp;D manage</title>
    <!-- Applica subito il tema scelto (o quello del sistema) per evitare il lampo di colore all'apertura. -->
    <script>try{var t=JSON.parse(localStorage.getItem('ui:theme')||'{}').t;if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
